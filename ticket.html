<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Ticket - Ruleta del Pulpo Cordial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: linear-gradient(145deg, #0b1c3a, #1a4b8c);
    min-height: 100vh; color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .ticket {
    background: linear-gradient(135deg, #112b4f, #0b1c3a);
    border: 3px solid #fbbf24;
    border-radius: 25px;
    max-width: 400px; width: 100%;
    padding: 30px 25px;
    box-shadow: 0 20px 60px rgba(251,191,36,0.3);
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .ticket::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
  }
  .pulpo-ticket {
    width: 80px; height: 80px; margin: 0 auto 10px;
    animation: flotar 2s ease-in-out infinite;
  }
  .pulpo-ticket img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .titulo-ticket {
    font-size: 1.2rem; color: #fbbf24; font-weight: bold;
    letter-spacing: 2px; margin-bottom: 5px;
  }
  .subtitulo-ticket {
    font-size: 0.85rem; color: #a0c4e8; margin-bottom: 25px;
  }
  .campo {
    margin-bottom: 15px;
    padding: 12px 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    border-left: 4px solid #fbbf24;
    text-align: left;
  }
  .campo .label {
    font-size: 0.7rem; color: #a0c4e8;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 3px;
  }
  .campo .valor {
    font-size: 1.1rem; color: white; font-weight: bold;
  }
  .campo .valor.codigo {
    color: #fbbf24; font-size: 1.3rem; letter-spacing: 2px;
  }
  .qr-seccion {
    margin: 20px 0;
    padding: 15px;
    background: white;
    border-radius: 15px;
    display: inline-block;
  }
  .qr-seccion img { display: block; }
  .botones {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-top: 20px;
  }
  .btn {
    flex: 1; min-width: 140px;
    padding: 14px 20px;
    border-radius: 60px;
    font-size: 1rem; font-weight: bold;
    text-decoration: none; text-align: center;
    border: none; cursor: pointer;
    transition: 0.3s;
  }
  .btn-compartir { background: #fbbf24; color: #0b1c3a; }
  .btn-ruleta { background: #22c55e; color: white; }
  .btn:hover { transform: scale(1.03); }
  .contador {
    margin-top: 20px;
    padding: 15px;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
  }
  .contador .barra {
    width: 100%; height: 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px; overflow: hidden;
    margin-top: 8px;
  }
  .contador .barra-fill {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    border-radius: 10px;
    transition: width 0.5s;
  }
</style>
</head>
<body>

<div class="ticket">
  <div class="pulpo-ticket"><img src="pulpo.png" alt="Pulpo Cordial"></div>
  <div class="titulo-ticket">RULETA DEL PULPO CORDIAL</div>
  <div class="subtitulo-ticket">Comunidad que se ayuda</div>

  <div class="campo">
    <div class="label">Participante</div>
    <div class="valor" id="nombreTicket">—</div>
  </div>

  <div class="campo">
    <div class="label">Celular</div>
    <div class="valor" id="celTicket">—</div>
  </div>

  <div class="campo">
    <div class="label">Código de referido</div>
    <div class="valor codigo" id="codigoTicket">—</div>
  </div>

  <div class="qr-seccion">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://ruleta.guia-digital.com" alt="QR Ruleta">
  </div>

  <div class="botones">
    <button class="btn btn-compartir" onclick="compartirTicket()">📤 Compartir</button>
    <a href="https://ruleta.guia-digital.com" class="btn btn-ruleta">🎰 Ir a la Ruleta</a>
  </div>

  <div class="contador">
    <div style="font-size:0.85rem; color:#a0c4e8;">Tickets vendidos</div>
    <div style="font-size:1.5rem; font-weight:bold; color:#fbbf24;"><span id="vendidos">0</span> / 100</div>
    <div class="barra"><div class="barra-fill" id="barra" style="width:0%"></div></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('nombreTicket').textContent = params.get('nombre') || 'Participante';
document.getElementById('celTicket').textContent = params.get('cel') || '—';
document.getElementById('codigoTicket').textContent = params.get('codigo') || 'PULPO-001';

function compartirTicket() {
  const nombre = document.getElementById('nombreTicket').textContent;
  const codigo = document.getElementById('codigoTicket').textContent;
  const texto = `🎰 Estoy participando en la Ruleta del Pulpo Cordial.\n\nAyudo al Comedor Social de Cúcuta.\n\nTú también puedes participar y ganar.\n\n👉 https://ruleta.guia-digital.com/?ref=${codigo}`;
  if (navigator.share) {
    navigator.share({ title: 'Ruleta del Pulpo Cordial', text: texto, url: 'https://ruleta.guia-digital.com' });
  } else {
    navigator.clipboard.writeText(texto);
    alert('📋 Ticket copiado. Pégalo donde quieras compartirlo.');
  }
}
</script>

</body>
</html>
