<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ruleta del Pulpo Cordial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: linear-gradient(145deg, #0b1c3a, #1a4b8c);
    min-height: 100vh; color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .encabezado { text-align: center; margin-bottom: 20px; }
  .pulpo { width: 100px; height: 100px; margin: 0 auto 10px; animation: flotar 2s ease-in-out infinite; }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .pulpo.hablando { animation: hablar 0.3s ease-in-out infinite; }
  @keyframes hablar {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-5px) scale(1.1); }
  }
  .pulpo img { width: 100%; height: 100%; object-fit: contain; }
  .titulo { font-size: 1.8rem; font-weight: 800; color: #fbbf24; text-shadow: 0 0 20px rgba(251,191,36,0.5); text-align: center; }
  .subtitulo { font-size: 0.95rem; color: #a0c4e8; text-align: center; margin-top: 5px; }

  .burbuja {
    background: white; color: #0b1c3a;
    border-radius: 20px;
    padding: 15px 20px;
    margin: 15px auto;
    max-width: 500px;
    font-size: 1rem;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: none;
  }
  .burbuja.activa { display: block; }
  .burbuja::after {
    content: ''; position: absolute;
    bottom: -15px; left: 50%;
    transform: translateX(-50%);
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 15px solid white;
  }

  .ruleta-wrapper {
    position: relative;
    width: 100%; max-width: 500px;
    aspect-ratio: 1/1;
    margin: 20px auto;
  }
  canvas {
    width: 100%; height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 80px rgba(251,191,36,0.4), 0 20px 60px rgba(0,0,0,0.5);
  }
  .aguja {
    position: absolute; top: -15px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 45px solid #fbbf24;
    z-index: 10;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }
  .centro {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    background: #0b1c3a;
    border: 6px solid #fbbf24;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
    box-shadow: 0 0 40px rgba(251,191,36,0.8);
    padding: 5px;
  }
  .centro img { width: 100%; height: 100%; object-fit: contain; }

  .botones { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  .btn {
    border: none; border-radius: 60px;
    padding: 15px 30px;
    font-size: 1rem; font-weight: bold;
    cursor: pointer; transition: 0.3s;
  }
  .btn-girar {
    background: #fbbf24; color: #0b1c3a;
    font-size: 1.2rem; padding: 18px 45px;
    box-shadow: 0 10px 30px rgba(251,191,36,0.4);
  }
  .btn-girar:hover { transform: scale(1.05); }
  .btn-girar:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-admin {
    background: #3b82f6; color: white;
    box-shadow: 0 10px 30px rgba(59,130,246,0.4);
  }
  .btn-admin:hover { transform: scale(1.05); }

  .panel-admin {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(11,28,58,0.98);
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
  }
  .panel-admin.activo { display: flex; }
  .panel-admin .cerrar {
    position: absolute; top: 15px; right: 15px;
    background: #ef4444; color: white;
    border: none; border-radius: 50%;
    width: 45px; height: 45px;
    font-size: 1.3rem; font-weight: bold;
    cursor: pointer;
  }
  .panel-admin .contenido {
    max-width: 600px; width: 100%;
    background: #112b4f;
    border: 2px solid #fbbf24;
    border-radius: 20px;
    padding: 25px;
    margin-top: 30px;
  }
  .panel-admin h2 {
    color: #fbbf24; text-align: center; margin-bottom: 15px;
  }
  .panel-admin .instrucciones {
    color: #a0c4e8; font-size: 0.9rem; text-align: center; margin-bottom: 15px;
  }
  .panel-admin textarea {
    width: 100%; height: 150px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white; font-family: inherit; font-size: 0.95rem;
    margin-bottom: 12px;
    resize: vertical;
  }
  .panel-admin textarea::placeholder { color: #9ca3af; }
  .panel-admin .acciones {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .panel-admin .acciones button {
    flex: 1; min-width: 120px;
    padding: 12px 20px;
    border-radius: 60px;
    font-size: 0.95rem; font-weight: bold;
    border: none; cursor: pointer;
    transition: 0.3s;
  }
  .btn-agregar { background: #22c55e; color: white; }
  .btn-reemplazar { background: #fbbf24; color: #0b1c3a; }
  .btn-limpiar { background: #ef4444; color: white; }
  .btn-cerrar-panel { background: #3b82f6; color: white; }
  .panel-admin .acciones button:hover { transform: scale(1.03); }

  .panel-admin .lista-actual {
    margin-top: 20px;
    max-height: 250px;
    overflow-y: auto;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 12px;
  }
  .panel-admin .lista-actual h3 {
    color: #fbbf24; font-size: 1rem; margin-bottom: 10px;
  }
  .panel-admin .lista-actual .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    margin-bottom: 5px;
    font-size: 0.9rem;
  }
  .panel-admin .lista-actual .item .nombre { color: white; flex: 1; }
  .panel-admin .lista-actual .item .cel { color: #a0c4e8; font-size: 0.8rem; margin-left: 8px; }
  .panel-admin .lista-actual .item .eliminar {
    background: #ef4444; color: white; border: none;
    border-radius: 50%; width: 28px; height: 28px;
    cursor: pointer; font-weight: bold;
    margin-left: 8px;
  }

  .anuncio {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(11,28,58,0.95);
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .anuncio.activo { display: flex; }
  .anuncio .premio { font-size: 1.5rem; color: #fbbf24; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
  .anuncio .pulpo-grande { width: 150px; height: 150px; margin: 0 auto 15px; animation: flotar 1s ease-in-out infinite; }
  .anuncio .pulpo-grande img { width: 100%; height: 100%; object-fit: contain; }
  .anuncio .nombre-gigante {
    font-size: 3rem; color: white;
    font-weight: 900; text-shadow: 0 0 30px rgba(251,191,36,0.8);
    margin: 10px 0; line-height: 1.1;
  }
  .anuncio .cel-gigante { font-size: 1.5rem; color: #a0c4e8; margin-top: 10px; }
  .anuncio .estrellas { font-size: 2rem; margin-top: 20px; animation: flotar 1s ease-in-out infinite; }
  .anuncio .cerrar {
    margin-top: 30px;
    background: #fbbf24; color: #0b1c3a;
    border: none; border-radius: 60px;
    padding: 15px 40px;
    font-size: 1.1rem; font-weight: bold;
    cursor: pointer;
  }

  .contador { margin-top: 20px; color: #a0c4e8; font-size: 0.95rem; text-align: center; }
  .contador strong { color: #fbbf24; font-size: 1.3rem; }

  .lista-ganadores {
    margin-top: 30px;
    background: rgba(0,0,0,0.3);
    border-radius: 20px; padding: 20px;
    max-width: 500px; width: 100%;
    border: 2px solid #fbbf24;
    display: none;
  }
  .lista-ganadores.activo { display: block; }
  .lista-ganadores h3 { color: #fbbf24; text-align: center; margin-bottom: 15px; font-size: 1.2rem; }
  .lista-ganadores .item {
    background: rgba(251,191,36,0.1);
    border-left: 4px solid #fbbf24;
    border-radius: 10px; padding: 12px 15px;
    margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .lista-ganadores .item .pos { color: #fbbf24; font-weight: bold; font-size: 1.1rem; margin-right: 10px; }
  .lista-ganadores .item .info { flex: 1; text-align: left; }
  .lista-ganadores .item .info .nombre { color: white; font-weight: bold; font-size: 1rem; }
  .lista-ganadores .item .info .cel { color: #a0c4e8; font-size: 0.8rem; }
  .lista-ganadores .item .premio { color: #fbbf24; font-weight: bold; font-size: 1.1rem; }
</style>
</head>
<body>

<div class="encabezado">
  <div class="pulpo" id="pulpo"><img src="pulpo.png" alt="Pulpo Cordial"></div>
  <div class="titulo">LA RULETA DEL PULPO CORDIAL</div>
  <div class="subtitulo">Comunidad que se ayuda</div>
</div>

<div class="burbuja" id="burbuja"></div>

<div class="ruleta-wrapper">
  <div class="aguja"></div>
  <canvas id="ruleta" width="1000" height="1000"></canvas>
  <div class="centro"><img src="pulpo.png" alt="Pulpo Cordial"></div>
</div>

<div class="botones">
  <button class="btn btn-girar" id="btnGirar" onclick="iniciarSorteo()">🎰 GIRAR</button>
  <button class="btn btn-admin" onclick="abrirPanel()">📝 AGREGAR PARTICIPANTES</button>
</div>

<div class="contador">
  Participantes en esta ronda: <strong id="totalParticipantes">0</strong>
</div>

<div class="lista-ganadores" id="listaGanadores">
  <h3>🏆 GANADORES DE ESTA RONDA</h3>
  <div id="itemsGanadores"></div>
</div>

<!-- PANEL ADMIN -->
<div class="panel-admin" id="panelAdmin">
  <button class="cerrar" onclick="cerrarPanel()">✕</button>
  <div class="contenido">
    <h2>📝 AGREGAR PARTICIPANTES</h2>
    <p class="instrucciones">Escribe un participante por línea con el formato: <strong>Nombre, Celular</strong></p>
    <textarea id="inputParticipantes" placeholder="Pedro Pérez, 0424-1234567
María González, 0414-7654321
José Ramírez, 0426-9876543"></textarea>
    <div class="acciones">
      <button class="btn-agregar" onclick="agregarParticipantes()">➕ Agregar</button>
      <button class="btn-reemplazar" onclick="reemplazarParticipantes()">🔄 Reemplazar</button>
      <button class="btn-limpiar" onclick="limpiarParticipantes()">🗑️ Limpiar</button>
    </div>
    <div class="lista-actual">
      <h3>Participantes actuales (<span id="contadorPanel">0</span>)</h3>
      <div id="listaParticipantesPanel"></div>
    </div>
  </div>
</div>

<!-- ANUNCIO GANADOR -->
<div class="anuncio" id="anuncio">
  <div class="pulpo-grande"><img src="pulpo.png" alt="Pulpo Cordial"></div>
  <div class="premio" id="premioTexto">🥇 PRIMER PREMIO</div>
  <div class="nombre-gigante" id="nombreGigante">Pedro Pérez</div>
  <div class="cel-gigante" id="celGigante">0424-1234567</div>
  <div class="estrellas">🎉 ✨ 🎊 ✨ 🎉</div>
  <button class="cerrar" onclick="cerrarAnuncio()">CONTINUAR</button>
</div>

<script>
// ===== PARTICIPANTES =====
let participantes = [];

// Datos de prueba (puedes borrarlos)
participantes = [
  { nombre: "Pedro Pérez", cel: "0424-1234567" },
  { nombre: "María González", cel: "0414-7654321" },
  { nombre: "José Ramírez", cel: "0426-9876543" },
  { nombre: "Ana Martínez", cel: "0412-5551234" },
  { nombre: "Luis Rodríguez", cel: "0416-8889999" },
  { nombre: "Carmen Díaz", cel: "0424-1112233" },
  { nombre: "Juan Sánchez", cel: "0414-2223344" },
  { nombre: "Rosa Fernández", cel: "0426-3334455" },
  { nombre: "Carlos Torres", cel: "0412-4445566" },
  { nombre: "Laura Jiménez", cel: "0416-5556677" }
];

const canvas = document.getElementById('ruleta');
const ctx = canvas.getContext('2d');
const colores = ['#fbbf24', '#1a4b8c', '#22c55e', '#3b82f6', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4'];

let anguloPorParticipante = 0;
let total = 0;
let rotacionActual = 0;
let girando = false;

// Premios por defecto (5 premios = 50% del pozo)
let premios = [
  { pos: "🥇", monto: "$50", label: "PRIMER PREMIO" },
  { pos: "🥈", monto: "$20", label: "SEGUNDO PREMIO" },
  { pos: "🥉", monto: "$10", label: "TERCER PREMIO" },
  { pos: "🏅", monto: "$10", label: "CUARTO PREMIO" },
  { pos: "🎖️", monto: "$10", label: "QUINTO PREMIO" }
];

let ganadoresActuales = [];
let premioActual = 0;

// ===== ACTUALIZAR CONTADOR =====
function actualizarContador() {
  document.getElementById('totalParticipantes').textContent = participantes.length;
}

// ===== CARGAR PARTICIPANTES =====
function cargarParticipantes() {
  total = participantes.length;
  anguloPorParticipante = total > 0 ? (Math.PI * 2) / total : 0;
  dibujarRuleta();
  actualizarContador();
}

// ===== DIBUJAR =====
function dibujarRuleta() {
  const centroX = canvas.width / 2;
  const centroY = canvas.height / 2;
  const radio = canvas.width / 2 - 30;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (total === 0) {
    ctx.fillStyle = '#112b4f';
    ctx.beginPath();
    ctx.arc(centroX, centroY, radio, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a0c4e8';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Sin participantes', centroX, centroY - 10);
    ctx.font = '18px Arial';
    ctx.fillText('Agrega participantes para comenzar', centroX, centroY + 20);
    return;
  }

  for (let i = 0; i < total; i++) {
    const anguloInicio = i * anguloPorParticipante + rotacionActual;
    const anguloFin = anguloInicio + anguloPorParticipante;

    ctx.beginPath();
    ctx.moveTo(centroX, centroY);
    ctx.arc(centroX, centroY, radio, anguloInicio, anguloFin);
    ctx.closePath();
    ctx.fillStyle = colores[i % colores.length];
    ctx.fill();
    ctx.strokeStyle = '#0b1c3a';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(centroX, centroY);
    ctx.rotate(anguloInicio + anguloPorParticipante / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#0b1c3a';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(participantes[i].nombre, radio - 20, -5);
    ctx.font = '11px Arial';
    ctx.fillText(participantes[i].cel, radio - 20, 10);
    ctx.restore();
  }
}

cargarParticipantes();

// ===== AUDIO =====
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function sonarTic() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = 800;
  osc.type = 'square';
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function sonarFanfarria() {
  if (!audioCtx) return;
  const notas = [523, 659, 784, 1047, 1319];
  notas.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'triangle';
    const tiempo = audioCtx.currentTime + i * 0.18;
    gain.gain.setValueAtTime(0, tiempo);
    gain.gain.linearRampToValueAtTime(0.25, tiempo + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, tiempo + 0.6);
    osc.start(tiempo);
    osc.stop(tiempo + 0.6);
  });
}

// ===== VOZ =====
function hablar(texto) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = 'es-ES';
    voz.rate = 0.9;
    voz.pitch = 1.3;
    voz.volume = 1;

    const voces = window.speechSynthesis.getVoices();
    let vozMujer = voces.find(v => v.lang.startsWith('es') && 
      (v.name.toLowerCase().includes('mujer') || 
       v.name.toLowerCase().includes('female') || 
       v.name.toLowerCase().includes('monica') || 
       v.name.toLowerCase().includes('paulina') || 
       v.name.toLowerCase().includes('helena') ||
       v.name.toLowerCase().includes('sabina') ||
       v.name.toLowerCase().includes('carmen') ||
       v.name.toLowerCase().includes('lucia')));
    
    if (!vozMujer) {
      vozMujer = voces.find(v => v.lang.startsWith('es'));
    }
    if (vozMujer) voz.voice = vozMujer;

    const pulpo = document.getElementById('pulpo');
    const burbuja = document.getElementById('burbuja');

    pulpo.classList.add('hablando');
    burbuja.textContent = texto;
    burbuja.classList.add('activa');

    voz.onend = () => {
      pulpo.classList.remove('hablando');
      burbuja.classList.remove('activa');
    };
    voz.onerror = () => {
      pulpo.classList.remove('hablando');
      burbuja.classList.remove('activa');
    };

    window.speechSynthesis.speak(voz);
  } catch(e) {}
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

// ===== GIRAR =====
function girarUnaVez() {
  return new Promise((resolve) => {
    const vueltas = 6 + Math.random() * 4;
    const anguloFinal = Math.random() * Math.PI * 2;
    const duracion = 6000;
    const inicio = performance.now();
    const rotacionInicial = rotacionActual;
    let ultimoTic = 0;

    function animar(tiempo) {
      const transcurrido = tiempo - inicio;
      const progreso = Math.min(transcurrido / duracion, 1);
      const easing = 1 - Math.pow(1 - progreso, 4);
      rotacionActual = rotacionInicial + (vueltas * Math.PI * 2 + anguloFinal) * easing;

      const intervalo = 100 + progreso * 300;
      if (transcurrido - ultimoTic > intervalo) {
        sonarTic();
        ultimoTic = transcurrido;
      }

      dibujarRuleta();

      if (progreso < 1) {
        requestAnimationFrame(animar);
      } else {
        resolve();
      }
    }

    requestAnimationFrame(animar);
  });
}

function calcularGanador() {
  const anguloAguja = -Math.PI / 2;
  let anguloNormalizado = (anguloAguja - rotacionActual) % (Math.PI * 2);
  if (anguloNormalizado < 0) anguloNormalizado += Math.PI * 2;
  const indiceGanador = Math.floor(anguloNormalizado / anguloPorParticipante) % total;
  return indiceGanador;
}

// ===== SORTEO =====
function iniciarSorteo() {
  if (girando) return;
  if (participantes.length === 0) {
    alert('No hay participantes. Agrega algunos primero.');
    return;
  }
  initAudio();
  girando = true;
  premioActual = 0;
  ganadoresActuales = [];
  document.getElementById('btnGirar').disabled = true;
  document.getElementById('itemsGanadores').innerHTML = '';
  document.getElementById('listaGanadores').classList.remove('activo');
  
  hablar("¡Atención, atención! Bienvenidos al sorteo de la Ruleta del Pulpo Cordial. Esta ronda apoya al Comedor Social y a la Proveeduría de Medicamentos de La Cumaca. ¡Vamos a lanzar la ruleta!");
  
  setTimeout(() => {
    girarSiguiente();
  }, 1500);
}

async function girarSiguiente() {
  if (premioActual >= premios.length || participantes.length === 0) {
    mostrarListaGanadores();
    girando = false;
    document.getElementById('btnGirar').disabled = false;
    
    let mensaje = "¡Tenemos nuestros ganadores! ";
    const posiciones = ["En primer lugar", "En segundo lugar", "En tercer lugar", "En cuarto lugar", "En quinto lugar"];
    ganadoresActuales.forEach((g, i) => {
      mensaje += posiciones[i] + ", " + g.nombre + ", ganó " + g.premio.monto + ". ";
    });
    mensaje += "¡Felicidades a todos! Recuerda: ayudando ganas, y ganando ayudas. ¡Nos vemos en el próximo sorteo!";
    
    hablar(mensaje);
    return;
  }

  await girarUnaVez();
  const indiceGanador = calcularGanador();
  const ganador = participantes[indiceGanador];
  ganadoresActuales.push({ ...ganador, premio: premios[premioActual] });

  // ELIMINAR al ganador de la ruleta (no puede ganar 2 veces)
  participantes.splice(indiceGanador, 1);
  cargarParticipantes();

  sonarFanfarria();
  mostrarAnuncio(ganador, premios[premioActual]);
  
  hablar("¡Felicidades, " + ganador.nombre + "! Ganaste el " + premios[premioActual].label + ". Tu número es " + ganador.cel + ". ¡Felicidades!");
}

function mostrarAnuncio(ganador, premio) {
  document.getElementById('premioTexto').textContent = premio.pos + ' ' + premio.label + ' — ' + premio.monto;
  document.getElementById('nombreGigante').textContent = ganador.nombre;
  document.getElementById('celGigante').textContent = ganador.cel;
  document.getElementById('anuncio').classList.add('activo');
}

function cerrarAnuncio() {
  document.getElementById('anuncio').classList.remove('activo');
  premioActual++;
  setTimeout(() => {
    girarSiguiente();
  }, 500);
}

function mostrarListaGanadores() {
  const contenedor = document.getElementById('itemsGanadores');
  contenedor.innerHTML = ganadoresActuales.map((g, i) => `
    <div class="item">
      <span class="pos">${i + 1}.</span>
      <div class="info">
        <div class="nombre">${g.nombre}</div>
        <div class="cel">${g.cel}</div>
      </div>
      <div class="premio">${g.premio.monto}</div>
    </div>
  `).join('');
  document.getElementById('listaGanadores').classList.add('activo');
}

// ===== PANEL ADMIN =====
function abrirPanel() {
  document.getElementById('panelAdmin').classList.add('activo');
  actualizarListaPanel();
}

function cerrarPanel() {
  document.getElementById('panelAdmin').classList.remove('activo');
}

function actualizarListaPanel() {
  document.getElementById('contadorPanel').textContent = participantes.length;
  const contenedor = document.getElementById('listaParticipantesPanel');
  contenedor.innerHTML = participantes.map((p, i) => `
    <div class="item">
      <span class="nombre">${p.nombre}</span>
      <span class="cel">${p.cel}</span>
      <button class="eliminar" onclick="eliminarParticipante(${i})">✕</button>
    </div>
  `).join('');
}

function eliminarParticipante(indice) {
  participantes.splice(indice, 1);
  cargarParticipantes();
  actualizarListaPanel();
}

function agregarParticipantes() {
  const texto = document.getElementById('inputParticipantes').value.trim();
  if (!texto) {
    alert('Escribe al menos un participante');
    return;
  }
  const lineas = texto.split('\n');
  let agregados = 0;
  lineas.forEach(linea => {
    const partes = linea.split(',');
    if (partes.length >= 2) {
      const nombre = partes[0].trim();
      const cel = partes[1].trim();
      if (nombre && cel) {
        participantes.push({ nombre, cel });
        agregados++;
      }
    }
  });
  if (agregados === 0) {
    alert('No se agregó ningún participante. Verifica el formato: Nombre, Celular');
    return;
  }
  document.getElementById('inputParticipantes').value = '';
  cargarParticipantes();
  actualizarListaPanel();
  alert('✅ ' + agregados + ' participante(s) agregado(s)');
}

function reemplazarParticipantes() {
  const texto = document.getElementById('inputParticipantes').value.trim();
  if (!texto) {
    alert('Escribe al menos un participante');
    return;
  }
  const nuevos = [];
  const lineas = texto.split('\n');
  lineas.forEach(linea => {
    const partes = linea.split(',');
    if (partes.length >= 2) {
      const nombre = partes[0].trim();
      const cel = partes[1].trim();
      if (nombre && cel) {
        nuevos.push({ nombre, cel });
      }
    }
  });
  if (nuevos.length === 0) {
    alert('No se agregó ningún participante. Verifica el formato: Nombre, Celular');
    return;
  }
  participantes = nuevos;
  document.getElementById('inputParticipantes').value = '';
  cargarParticipantes();
  actualizarListaPanel();
  alert('🔄 Lista reemplazada con ' + nuevos.length + ' participante(s)');
}

function limpiarParticipantes() {
  if (!confirm('¿Seguro que quieres eliminar TODOS los participantes?')) return;
  participantes = [];
  cargarParticipantes();
  actualizarListaPanel();
}
</script>
